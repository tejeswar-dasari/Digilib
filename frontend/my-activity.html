<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Activity | DigiLib</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script>
        tailwind.config = { darkMode: 'class', theme: { extend: { colors: { brand: { 500:'#6366f1', 600:'#4f46e5', 700:'#4338ca' } } } } };
    </script>
</head>
<body class="min-h-screen bg-slate-50 dark:bg-slate-950 text-slate-900 dark:text-white">
    <header class="sticky top-0 z-30 bg-white/90 dark:bg-slate-950/90 backdrop-blur-md border-b border-slate-200 dark:border-slate-800">
        <div class="max-w-6xl mx-auto px-4 sm:px-6 py-4 flex items-center justify-between gap-4">
            <a href="index.html" class="flex items-center gap-3 font-extrabold">
                <span class="w-10 h-10 rounded-xl bg-brand-600 text-white flex items-center justify-center"><i data-lucide="book-open-check"></i></span>
                <span>Digi<span class="text-brand-600">lib</span></span>
            </a>
            <a href="index.html" class="inline-flex items-center gap-2 px-4 py-2 rounded-xl bg-slate-100 dark:bg-slate-900 text-xs font-bold hover:bg-slate-200 dark:hover:bg-slate-800">
                <i data-lucide="arrow-left" class="w-4 h-4"></i> Back to Portal
            </a>
        </div>
    </header>

    <main class="max-w-6xl mx-auto px-4 sm:px-6 py-10">
        <div id="page-state" class="mb-6"></div>
        <section class="bg-white dark:bg-slate-900 rounded-3xl border border-slate-200 dark:border-slate-800 shadow-sm overflow-hidden">
            <div class="p-6 sm:p-8 border-b border-slate-200 dark:border-slate-800">
                <div class="flex flex-col sm:flex-row sm:items-center sm:justify-between gap-4">
                    <div>
                        <p class="text-xs font-extrabold uppercase tracking-widest text-brand-600">Academic Workspace</p>
                        <h1 class="text-2xl sm:text-3xl font-black mt-1">My Activity</h1>
                        <p id="user-summary" class="text-sm text-slate-500 dark:text-slate-400 mt-2">Loading your account...</p>
                    </div>
                    <div class="flex gap-2">
                        <button data-tab="requests" class="tab-btn px-4 py-2.5 rounded-xl text-xs font-extrabold bg-brand-600 text-white">My Requests</button>
                        <button data-tab="contributions" class="tab-btn px-4 py-2.5 rounded-xl text-xs font-extrabold bg-slate-100 dark:bg-slate-800 text-slate-700 dark:text-slate-200">My Contributions</button>
                    </div>
                </div>
            </div>
            <div id="activity-content" class="p-6 sm:p-8 min-h-[280px]"></div>
        </section>
    </main>

    <script src="js/shared.js"></script>
    <script>
        let currentTab = location.hash.replace('#','') === 'contributions' ? 'contributions' : 'requests';
        let currentUser = null;

        function escapeHtml(value) {
            return String(value ?? '').replace(/[&<>'"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));
        }
        function setState(html) { document.getElementById('activity-content').innerHTML = html; if (window.lucide) lucide.createIcons(); }
        function setTab(tab) {
            currentTab = tab === 'contributions' ? 'contributions' : 'requests';
            history.replaceState(null, '', '#' + currentTab);
            document.querySelectorAll('.tab-btn').forEach(btn => {
                const active = btn.dataset.tab === currentTab;
                btn.className = 'tab-btn px-4 py-2.5 rounded-xl text-xs font-extrabold ' + (active ? 'bg-brand-600 text-white' : 'bg-slate-100 dark:bg-slate-800 text-slate-700 dark:text-slate-200');
            });
            loadActivity();
        }
        async function loadActivity() {
            if (!currentUser) return;
            setState('<div class="py-16 text-center text-sm text-slate-500"><i data-lucide="loader-circle" class="w-7 h-7 mx-auto mb-3 animate-spin"></i>Loading...</div>');
            try {
                const endpoint = currentTab === 'requests' ? '/me/requests' : '/me/resources';
                const response = await window.digilibApiFetch(endpoint);
                const data = await response.json().catch(() => []);
                if (!response.ok) throw new Error(data.message || 'Unable to load your activity.');
                if (!Array.isArray(data) || !data.length) {
                    setState(`<div class="py-16 text-center"><div class="w-14 h-14 mx-auto rounded-2xl bg-slate-100 dark:bg-slate-800 flex items-center justify-center"><i data-lucide="inbox" class="w-7 h-7 text-slate-400"></i></div><h2 class="mt-4 font-extrabold">No ${currentTab === 'requests' ? 'requests' : 'contributions'} yet</h2><p class="mt-1 text-sm text-slate-500">Your ${currentTab === 'requests' ? 'resource requests' : 'submitted resources'} will appear here.</p></div>`);
                    return;
                }
                setState(data.map(item => currentTab === 'requests' ? requestCard(item) : resourceCard(item)).join(''));
            } catch (error) {
                setState(`<div class="py-16 text-center"><i data-lucide="circle-alert" class="w-8 h-8 mx-auto text-rose-500"></i><h2 class="mt-3 font-extrabold">Could not load activity</h2><p class="mt-1 text-sm text-slate-500">${escapeHtml(error.message)}</p><button onclick="loadActivity()" class="mt-4 px-4 py-2 rounded-xl bg-brand-600 text-white text-xs font-bold">Try Again</button></div>`);
            }
        }
        function requestCard(item) {
            return `<article class="p-5 rounded-2xl border border-slate-200 dark:border-slate-800 bg-slate-50/70 dark:bg-slate-950/50 mb-3"><div class="flex items-start justify-between gap-4"><div><h3 class="font-extrabold">${escapeHtml(item.resourceTitle || 'Untitled request')}</h3><p class="text-xs text-slate-500 mt-1">${escapeHtml(item.branch || item.category || 'General')}</p></div><span class="text-[10px] font-extrabold uppercase px-2.5 py-1 rounded-full bg-amber-100 text-amber-700 dark:bg-amber-950/40 dark:text-amber-300">${escapeHtml(item.status || 'Pending')}</span></div><p class="text-sm text-slate-600 dark:text-slate-300 mt-3">${escapeHtml(item.details || 'No additional details provided.')}</p><p class="text-[11px] text-slate-400 mt-3">${item.createdAt ? new Date(item.createdAt).toLocaleString() : ''}</p></article>`;
        }
        function resourceCard(item) {
            const url = item.url || '';
            return `<article class="p-5 rounded-2xl border border-slate-200 dark:border-slate-800 bg-slate-50/70 dark:bg-slate-950/50 mb-3"><div class="flex items-start justify-between gap-4"><div><h3 class="font-extrabold">${escapeHtml(item.name || 'Untitled resource')}</h3><p class="text-xs text-slate-500 mt-1">${escapeHtml(item.subject || item.branch || item.category || 'Academic resource')}</p></div><span class="text-[10px] font-extrabold uppercase px-2.5 py-1 rounded-full bg-emerald-100 text-emerald-700 dark:bg-emerald-950/40 dark:text-emerald-300">Contribution</span></div><p class="text-[11px] text-slate-400 mt-3">${item.createdAt ? new Date(item.createdAt).toLocaleString() : ''} · ${Number(item.clicks || 0)} views</p>${url ? `<a href="${escapeHtml(url)}" target="_blank" rel="noopener noreferrer" class="inline-flex mt-3 px-4 py-2 rounded-xl bg-brand-600 text-white text-xs font-bold">Open Resource</a>` : ''}</article>`;
        }
        document.addEventListener('DOMContentLoaded', async () => {
            lucide.createIcons();
            currentUser = window.syncAuthenticatedUser ? await window.syncAuthenticatedUser() : null;
            if (!currentUser) {
                document.getElementById('page-state').innerHTML = '<div class="p-4 rounded-2xl bg-amber-50 text-amber-800 border border-amber-200 text-sm font-semibold">Please log in to view your activity. <a class="underline font-extrabold" href="index.html">Go to Login</a></div>';
                document.getElementById('user-summary').textContent = 'Not signed in';
                setState('<div class="py-16 text-center text-sm text-slate-500">Sign in to access your personal activity.</div>');
                return;
            }
            document.getElementById('user-summary').textContent = `${currentUser.name || 'Student'} · ${currentUser.email || ''}`;
            document.querySelectorAll('.tab-btn').forEach(btn => btn.addEventListener('click', () => setTab(btn.dataset.tab)));
            setTab(currentTab);
        });
    </script>
</body>
</html>
